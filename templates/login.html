<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Let's Go Brew Café</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-image">

            <div class="overlay">

                <h1>Let's Go Brew</h1>

                <p>
                    Good coffee, good food,<br>
                    and good vibes.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-form-container">

            <div class="login-form">

                <div class="logo">
                    <h2>Let's Go Brew</h2>
                    <span>CAFÉ</span>
                </div>

                <h1>Welcome Back!</h1>

                <p class="subtitle">
                    Login to continue
                </p>


                <!-- ERROR MESSAGE -->

                {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

                {% endif %}


                <!-- LOGIN FORM -->

                <form method="POST"
                      action="{{ url_for('login') }}">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button type="submit"
                            class="login-button">

                        LOGIN

                    </button>

                </form>


                <div class="signup-link">

                    <p>
                        Don't have an account?
                        <a href="{{ url_for('signup') }}">
                            Sign Up
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
